<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gloxy AI</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#131314;--panel:#1e1f20;--soft:#282a2c;--text:#e3e3e3;--muted:#9aa0a6;--accent:#a8c7fa;--line:#3c4043}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Arabic",sans-serif;height:100dvh;display:flex;flex-direction:column}
header{height:64px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #ffffff12;flex-shrink:0}.brand{font-size:21px;font-weight:700;background:linear-gradient(90deg,#8ab4f8,#c58af9,#f28b82);color:transparent;background-clip:text}
main{width:min(900px,100%);margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;padding:18px}#chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:18px;padding:10px 0 20px}
.welcome{margin:auto;text-align:center;color:var(--muted);line-height:1.8}.welcome h1{font-size:30px;color:var(--text);margin:0 0 8px}
.msg{max-width:90%;padding:13px 16px;border-radius:18px;line-height:1.75;overflow-wrap:anywhere}.user{align-self:flex-start;background:var(--soft);border-bottom-left-radius:5px}.bot{align-self:flex-end;width:100%;padding:4px 2px}
.msg img{max-width:100%;max-height:300px;border-radius:12px}.msg pre{direction:ltr;text-align:left;white-space:pre;overflow:auto;background:#101113;padding:12px;border-radius:10px}.msg code{font-family:monospace}.msg a{color:var(--accent)}
#attachments{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0}.filechip{background:var(--soft);padding:7px 10px;border-radius:9px;font-size:12px;color:var(--muted)}
.composer{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:10px;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-height:38px;max-height:130px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:16px Arial;padding:9px}
button,.attach{border:0;cursor:pointer;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;background:var(--soft);color:var(--text);font-size:20px}button.send{background:var(--accent);color:#142033;font-size:18px}
input[type=file]{display:none}.hint{text-align:center;color:var(--muted);font-size:11px;margin:9px 0 0}#status{font-size:12px;color:var(--muted);min-height:18px;padding:4px}
@media(max-width:600px){main{padding:10px}.msg{max-width:96%}}
</style></head>
<body><header><div class="brand">Gloxy AI</div></header><main>
<section id="chat"><div class="welcome" id="welcome"><h1>مرحباً بك في Gloxy AI</h1>أرسل سؤالاً أو أرفق صورة أو ملفاً لتحليله.</div></section>
<div id="attachments"></div><div id="status"></div>
<form class="composer" id="form"><label class="attach" for="file" title="إرفاق صورة أو ملف">＋</label>
<input id="file" type="file" accept="image/*,.pdf,.docx,.txt,.md,.csv,.js,.html,.css,.json,.xml,.py,.java,.c,.cpp,.sql">
<textarea id="prompt" placeholder="اكتب رسالتك إلى Gloxy AI..." rows="1"></textarea><button class="send" type="submit" title="إرسال">➤</button></form>
<div class="hint">يدعم الصور وPDF وWord (DOCX) والملفات النصية والبرمجية · الحد الأقصى للملف 3 MB</div></main>
<script>
const chat=document.getElementById("chat"),promptBox=document.getElementById("prompt"),fileInput=document.getElementById("file");
let history=[],selectedFile=null;
function addMessage(text,who,isMarkdown=false){
 const el=document.createElement("div");el.className="msg "+who;
 if(isMarkdown&&window.marked&&window.DOMPurify){el.innerHTML=DOMPurify.sanitize(marked.parse(text));el.querySelectorAll("a").forEach(a=>{a.target="_blank";a.rel="noopener noreferrer"});}
 else el.textContent=text;
 chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el;
}
fileInput.addEventListener("change",()=>{const picked=fileInput.files[0]||null;if(picked&&picked.size>3*1024*1024){alert("حجم الملف يجب ألا يتجاوز 3 MB على هذا الموقع.");fileInput.value="";selectedFile=null;document.getElementById("attachments").textContent="";return;}selectedFile=picked;document.getElementById("attachments").textContent=selectedFile?"📎 "+selectedFile.name+" · "+(selectedFile.size/1024/1024).toFixed(2)+" MB":"";});
promptBox.addEventListener("input",()=>{promptBox.style.height="auto";promptBox.style.height=Math.min(promptBox.scrollHeight,130)+"px"});
promptBox.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.getElementById("form").requestSubmit()}});
document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault();const message=promptBox.value.trim();if(!message&&!selectedFile)return;
 document.getElementById("welcome")?.remove();addMessage(message+(selectedFile?"\n📎 "+selectedFile.name:""),"user");
 const fileForRequest=selectedFile;history.push({role:"user",content:message||"حلل الملف المرفق وأخبرني بمحتواه."});
 promptBox.value="";promptBox.style.height="auto";selectedFile=null;fileInput.value="";document.getElementById("attachments").textContent="";
 const status=document.getElementById("status");status.textContent="Gloxy AI يفكر...";
 const loading=addMessage("جاري تحليل طلبك والملف المرفق...","bot");
 try{
  const fd=new FormData();fd.append("message",message);fd.append("history",JSON.stringify(history.slice(0,-1)));if(fileForRequest)fd.append("file",fileForRequest);
  const response=await fetch("/api/chat",{method:"POST",body:fd});const data=await response.json();loading.remove();
  if(!response.ok)throw new Error(data.error||"حدث خطأ غير معروف");
  addMessage(data.answer,"bot",true);history.push({role:"assistant",content:data.answer});status.textContent="النموذج: "+data.model;
 }catch(err){loading.remove();addMessage("⚠️ "+err.message,"bot");status.textContent="تعذر إكمال الطلب";history.pop();}
});
</script></body></html>
